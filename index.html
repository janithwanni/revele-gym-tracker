<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Relevé</title>
  <meta name="description" content="Workout tracker for dancers: unilateral strength, plyometrics and functional training.">
  <meta name="theme-color" content="#0e0c11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Relevé">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
  <main id="app"></main>

  <div id="restbar" hidden>
    <div class="restinfo">
      <div class="eyebrow" id="restLabel">Rest</div>
      <div id="restTime">0:00</div>
    </div>
    <div class="restbtns">
      <button class="secondary sm" data-act="restAdj" data-d="-15">−15</button>
      <button class="secondary sm" data-act="restAdj" data-d="15">+15</button>
      <button class="primary sm" data-act="restSkip">Skip</button>
    </div>
    <div id="restFill"></div>
  </div>

  <nav id="tabs">
    <a href="#/home" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
      <span id="trainLbl">Train</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>History</span>
    </a>
    <a href="#/progress" data-tab="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4.5-5 3.5 3 6-7"/></svg>
      <span>Progress</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <dialog id="dlg"></dialog>
  <datalist id="lib"></datalist>
  <div id="toast" hidden></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
